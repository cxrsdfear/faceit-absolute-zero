<!doctype html><html><head><meta charset="utf-8"><title>harness</title>
<style>
body{margin:0;background:#1a1220 url(/sakura.jpg) center/cover;font-family:Roboto,Arial,sans-serif;color:#fff}
.wrap{display:flex;gap:60px;padding:30px;justify-content:center}
.col{width:380px}
.ListContentPlayer__Background-x{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.08);border-radius:8px}
.ListContentPlayer__Background-x img{width:48px;height:48px;border-radius:50%;background:#333}
.Nickname__Name-x{font-weight:700;font-size:16px}
.holder{margin-bottom:20px}
.elo{margin-left:auto;display:flex;align-items:center;gap:6px}
svg.SkillIcon-x{width:28px;height:28px}
</style></head><body>
<div class="wrap" id="w"></div>
<script>
const nicks=["Ponyfix","kr1stal","AWPenis","lurk3r","clutchgod"];
const elos=[2197,2063,1650,2740,3120];
document.getElementById("w").innerHTML=[0,1].map(t=>`<div class="col">${nicks.map((n,i)=>`<div class="holder"><div class="ListContentPlayer__Background-x"><img><div><div class="Nickname__Name-x">${n}</div></div><div class="elo"><span>${elos[i]}</span><svg class="SkillIcon-x" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="red"/></svg></div></div></div>`).join("")}</div>`).join("");
// class names must contain the prefixes content.js looks for
document.querySelectorAll("[class*=Background-x]").forEach(e=>e.className="ListContentPlayer__Background-abc");
document.querySelectorAll(".Nickname__Name-x").forEach(e=>e.className="Nickname__Name-abc");
document.querySelectorAll("svg").forEach(e=>{e.setAttribute("class","SkillIcon-abc");e.style.width="28px";e.style.height="28px"});
const rnd=(a)=>{let x=a;return()=>{x=(x*9301+49297)%233280;return x/233280}};
window.chrome={runtime:{getURL:p=>"/"+p,getManifest:()=>({version:"9.9.9"}),onMessage:{addListener(){}}},storage:{local:{get:(d,cb)=>cb&&cb({...d,enabled:true}),set:()=>Promise.resolve(),onChanged:{addListener(){}}},onChanged:{addListener(){}}}};
const realFetch=fetch;
window.fetch=async(u,o)=>{u=String(u);const J=(x)=>({ok:true,json:async()=>x});
if(u.includes("/nicknames/")){const n=decodeURIComponent(u.split("/").pop());return J({payload:{id:n,nickname:n,country:["ru","ua","kz","de","by"][nicks.indexOf(n)%5]}})}
if(u.includes("/stats/time/")){const r=rnd(u.length*7);return J(Array.from({length:100},(_,i)=>({matchId:"m"+i,i6:String(10+Math.floor(r()*20)),i8:String(10+Math.floor(r()*14)),i7:"4",i10:r()>.45?"1":"0",i12:"24",i13:String(5+Math.floor(r()*10)),c10:String(60+Math.floor(r()*40)),date:Date.now()-i*8e7,i2:"t1",teamId:"t1",i1:"de_mirage"})))}
if(u.includes("/games/cs2")&&u.includes("/stats/users/"))return J({lifetime:{m1:"1840",k43:"0.30",k19:"0.3",k18:"0.6",k24:"0.4",k26:"6",k20:"0.5",k21:"0.2",k9:"0.75"},segments:[]});
return realFetch(u,o)};
</script>
<script src="/content.js"></script>
</body></html>
