<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
:root {
--text: #f6f3ff;
--dim: rgba(232,224,255,.62);
--p1: #8b5cf6;
--p2: #c084fc;
--p3: #60a5fa;
--glow: rgba(150,100,255,.6);
--edge: rgba(255,255,255,.28);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #0a0716; color-scheme: dark; }
body {
position: relative; width: 372px; max-height: 600px; margin: 0; padding: 18px; overflow-x: hidden; overflow-y: auto;
scrollbar-width: none; background: #0a0716; color: var(--text);
font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
body::-webkit-scrollbar { display: none; }
/* Slow drifting colour behind the glass, so there is something to refract */
.blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blobs i { position: absolute; width: 260px; height: 260px; border-radius: 50%; filter: blur(48px); opacity: .85; animation: drift 14s ease-in-out infinite alternate; }
.blobs i:nth-child(1) { left: -80px; top: -60px; background: #7c3aed; }
.blobs i:nth-child(2) { right: -90px; top: 180px; background: #3b82f6; animation-delay: -5s; animation-duration: 17s; }
.blobs i:nth-child(3) { left: 30px; bottom: -120px; background: #ec4899; opacity: .6; animation-delay: -9s; animation-duration: 19s; }
@keyframes drift { to { transform: translate(70px, 50px) scale(1.2); } }
.wrap { position: relative; z-index: 1; }
header { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
header img { width: 44px; height: 44px; border-radius: 14px; box-shadow: 0 0 0 1px var(--edge), 0 6px 22px var(--glow); }
h1 { flex: 1; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; text-shadow: 0 0 18px var(--glow); }
h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.28), transparent); }
/* Liquid glass: blur, a bright rim on the light side, a soft one opposite */
.glass, .card, .tile.custom, input[type=url], input[type=text], input[type=date], select, button.ghost {
background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 55%, rgba(255,255,255,.1));
-webkit-backdrop-filter: blur(22px) saturate(1.7);
backdrop-filter: blur(22px) saturate(1.7);
box-shadow: inset 2px 2px 0 rgba(255,255,255,.5), inset -1px -1px 0 rgba(255,255,255,.14), inset 0 0 22px rgba(255,255,255,.05), 0 12px 30px rgba(0,0,0,.35);
}
.card { margin-bottom: 12px; padding: 15px; border-radius: 24px; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; z-index: 1; margin: 0; opacity: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px var(--edge), inset 0 2px 6px rgba(0,0,0,.3); pointer-events: none; transition: background .3s, box-shadow .3s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(180deg, #fff, #dcd2ff); box-shadow: 0 2px 8px rgba(0,0,0,.4), inset 0 -2px 4px rgba(120,90,200,.35); transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
.switch input:checked + i { background: linear-gradient(135deg, var(--p1), var(--p2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4), 0 0 20px var(--glow); }
.switch input:checked + i::after { transform: translateX(22px); }
.switch input:active + i::after { width: 28px; }
.switch input:checked:active + i::after { transform: translateX(18px); }
.gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile {
position: relative; height: 62px; padding: 0; overflow: hidden; border: 0; border-radius: 16px;
background: #888 center / cover no-repeat; cursor: pointer;
box-shadow: inset 0 0 0 1px var(--edge), 0 6px 14px rgba(0,0,0,.3);
transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s;
}
.tile::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.28), transparent 45%, rgba(10,7,22,.6)); }
.tile:hover { transform: translateY(-3px) scale(1.04); }
.tile:active { transform: scale(.96); }
.tile span { position: absolute; left: 0; right: 0; bottom: 5px; z-index: 1; text-align: center; color: #fff; font-size: 10.5px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
.tile.on { box-shadow: inset 0 0 0 2px #fff, 0 0 22px var(--glow); }
.tile.on::after { content: "✓"; position: absolute; top: 4px; right: 4px; z-index: 1; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff; font-size: 10px; font-weight: 800; box-shadow: 0 0 10px var(--glow); }
.tile.custom { grid-column: 1 / -1; height: 42px; color: var(--text); font: inherit; font-weight: 600; border-radius: 16px; }
.tile.custom::before { display: none; }
.tile.custom.on { box-shadow: inset 0 0 0 2px #fff, 0 0 22px var(--glow); }
.row { display: flex; gap: 8px; margin-top: 10px; }
input[type=url], input[type=text], input[type=date], select { width: 100%; height: 38px; padding: 0 14px; border: 0; border-radius: 14px; color: var(--text); font: inherit; outline: none; box-shadow: inset 1px 1px 0 rgba(255,255,255,.35), inset -1px -1px 0 rgba(255,255,255,.1); transition: box-shadow .2s; }
input::placeholder { color: rgba(232,224,255,.42); }
input:focus, select:focus { box-shadow: inset 0 0 0 2px #fff, 0 0 18px var(--glow); }
select option { background: #1a1233; }
button.small {
flex: none; height: 38px; padding: 0 18px; border: 0; border-radius: 14px; cursor: pointer;
background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff; font: inherit; font-weight: 700;
box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), 0 6px 20px rgba(139,92,246,.5); transition: transform .2s cubic-bezier(.3,1.4,.5,1), filter .15s;
}
button.small:hover { filter: brightness(1.15); }
button.small:active, button.ghost:active { transform: scale(.96); }
button.ghost { width: 100%; height: 40px; border: 0; border-radius: 16px; color: var(--dim); font: inherit; cursor: pointer; transition: color .15s, transform .2s cubic-bezier(.3,1.4,.5,1); }
button.ghost:hover { color: var(--text); }
.hint { margin-top: 10px; color: var(--dim); font-size: 11px; }
.slider { display: block; margin-top: 14px; }
.slider:first-of-type { margin-top: 0; }
.slider b { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 500; }
.slider b em { color: #fff; font-style: normal; font-weight: 600; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; margin: 0; border-radius: 99px; background: linear-gradient(90deg, var(--p1), var(--p2)) 0 0 / var(--fill, 50%) 100% no-repeat, rgba(255,255,255,.14); box-shadow: inset 0 1px 3px rgba(0,0,0,.35); outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(180deg, #fff, #e4dcff); box-shadow: 0 3px 10px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.25), 0 0 16px var(--glow); transition: transform .15s; }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.18); }
#msg { margin-top: 8px; color: #ffb4c8; font-size: 12px; }
#msg:empty { display: none; }
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="wrap">
<header>
<img src="icon128.png" alt="">
<h1>Absolute Zero</h1>
<label class="switch" title="Включить или выключить тему">
<input type="checkbox" id="enabled"><i></i>
</label>
</header>
<section class="card">
<h2>Фон</h2>
<div class="gallery">
<button class="tile" data-preset="preset:sakura" data-file="sakura.jpg"><span>Сакура</span></button>
<button class="tile" data-preset="preset:wings" data-file="wings.jpg"><span>Крылья</span></button>
<button class="tile" data-preset="preset:cat" data-file="cat.jpg"><span>Котик</span></button>
<button class="tile" data-preset="preset:lily" data-file="lily.jpg"><span>Лилии</span></button>
<button class="tile custom" id="pick">＋ Свой файл или GIF</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="row">
<input type="url" id="url" placeholder="Или ссылка на картинку">
<button class="small" id="useUrl">OK</button>
</div>
<div class="hint">Цвета темы подстраиваются под фон, у GIF — меняются вместе с ним.</div>
<div id="msg"></div>
</section>
<section class="card">
<h2>Настройка</h2>
<label class="slider"><b>Затемнение <em id="dimV"></em></b><input type="range" id="dim" min="0" max="90"></label>
<label class="slider"><b>Размытие <em id="blurV"></em></b><input type="range" id="blur" min="0" max="30"></label>
<label class="slider"><b>Плотность панели <em id="panelsV"></em></b><input type="range" id="panels" min="0" max="100"></label>
<div class="row">
<select id="fit" title="Размещение">
<option value="cover">Заполнить экран</option>
<option value="contain">Вписать целиком</option>
<option value="tile">Плитка</option>
</select>
</div>
</section>
<section class="card">
<h2>Пик за сезон</h2>
<input type="date" id="seasonStart" title="Дата начала сезона">
<div class="hint">Дату начала сезона FACEIT не отдаёт: укажите её, и пик Elo будет считаться с этого дня.</div>
</section>
<section class="card">
<h2>Шрифт сайта</h2>
<select id="fontPick">
<option value="">Как у FACEIT</option>
<option>Play</option>
<option>Goldman</option>
<option>Coiny</option>
<option>Geist</option>
<option>Geist Mono</option>
<option>Segoe UI</option>
<option>Bahnschrift</option>
<option>Trebuchet MS</option>
<option>Verdana</option>
<option>Georgia</option>
<option>Consolas</option>
<option value="custom">Свой…</option>
</select>
<div class="row"><input type="text" id="fontCustom" placeholder="Название шрифта, установленного в Windows" hidden></div>
</section>
<section class="card">
<h2>Кнопка «Найти матч»</h2>
<input type="text" id="buttonText" maxlength="24" placeholder="Свой текст на кнопке">
</section>
<button class="ghost glass" id="clear">Сбросить фон</button>
</div>
<script src="popup.js"></script>
</body>
</html>
